name: ci

# What this repo actually ships: two extensionless scripts (a POSIX sh wrapper and a
# python MCP server) and markdown. The suite asserts skill text agrees with the runtime
# and drives both scripts as subprocesses, so the gate is: the wrapper parses as POSIX
# sh, the MCP server byte-compiles, and the suite passes.
#
# COVERAGE IS GATED, ON THE SHIPPED PYTHON ONLY, AND THE GATE CHECKS ITS OWN MEASUREMENT.
# Every script test runs `subprocess.run([script, ...])`, so a plain `coverage run`
# traced only the parent. Measured on the tree before the fix:
#   CoverageWarning: No data was collected. (no-data-collected)
#   No data to report.
# The number now comes from the process-start hook (ci/coverage/sitecustomize.py plus
# COVERAGE_PROCESS_START, carried into children by tests/conftest.py and
# tests/coverage_bootstrap.py -- some tests build a child env from scratch, so the
# bootstrap has to be handed over deliberately or the child goes unmeasured in silence).
# See scripts/run-coverage.sh: it fails if no child data file was written, if a child
# said it could not import coverage, or if the report has no row for the shipped script,
# because `--fail-under` alone would call an empty measurement green.
#
# The sh wrapper and install/install.sh are not Python: no coverage percentage describes
# them, and none is claimed for them. Their gate is `sh -n` plus behaviour tests.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # requirements-dev.txt exists because the suite needs jsonschema, which the
        # runner does not carry; installing only pytest left CI red on the first run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: POSIX syntax check (skill wrapper)
        run: sh -n skill/herdr-artifact/scripts/herdr-artifact

      - name: Byte-compile the shipped python and the test rig
        run: |
          python -m py_compile skill/herdr-artifact/scripts/herdr-artifact-mcp
          python -m py_compile ci/coverage/sitecustomize.py tests/*.py

      - name: Suite + coverage
        # scripts/run-coverage.sh runs pytest (with -rs, so skip reasons stay visible:
        # one test needs the installed herdr-eng runtime, which the runner cannot have --
        # see the module docstring of tests/test_reports.py), then combines the children's
        # data and gates the shipped Python at the measured floor.
        run: bash scripts/run-coverage.sh

      - name: Record what the runner could not prove
        if: always()
        run: |
          {
            echo '## Suite'
            if [ -f .coverage-data/suite.log ]; then
              grep -E 'SKIPPED|[0-9]+ (passed|failed)' .coverage-data/suite.log | tail -20
            else
              echo 'no suite log: run-coverage.sh failed before the suite ran'
            fi
            echo
            echo 'SKIPPED lines above are real gaps in this runner, not successes.'
            echo 'The coverage figure covers the shipped python only; the sh wrapper and'
            echo 'install.sh are not python and are gated by `sh -n` and behaviour tests.'
          } >> "$GITHUB_STEP_SUMMARY"
